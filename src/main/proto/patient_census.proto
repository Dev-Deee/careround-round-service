syntax = "proto3";

package careround.patient;

option java_package = "com.dayo.careround.patientservice.grpc";
option java_multiple_files = true;

service PatientCensusService {
  rpc GetAdmittedCount (WardCensusRequest) returns (WardCensusResponse);
  rpc PatientExists (PatientExistsRequest) returns (PatientExistsResponse);
}

message WardCensusRequest {
  string ward_id = 1;
}

message WardCensusResponse {
  int32 admitted_count = 1;
}

message PatientExistsRequest {
  string patient_id = 1;
}

message PatientExistsResponse {
  bool exists = 1;
}