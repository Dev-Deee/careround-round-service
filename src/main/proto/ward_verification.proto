syntax = "proto3";

package careround.ward;

option java_package = "com.dayo.careround.wardservice.grpc";
option java_multiple_files = true;

service WardVerificationService {
  rpc WardExists (WardExistsRequest) returns (WardExistsResponse);
}

message WardExistsRequest {
  string ward_id = 1;
}

message WardExistsResponse {
  bool exists = 1;
}
