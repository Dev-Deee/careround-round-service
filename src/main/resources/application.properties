spring.application.name=careround-round-service

server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/careround_round_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.public-key=${JWT_PUBLIC_KEY}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=round-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

grpc.client.patient-service.address=static://localhost:9090
grpc.client.patient-service.negotiationType=plaintext

grpc.client.ward-service.address=static://localhost:9093
grpc.client.ward-service.negotiationType=plaintext
